[package]
name = "lincli"
version = "2026.5.5"
edition = "2024"
description = "Fast, agent-friendly Linear CLI — manage issues, projects, cycles from the terminal"
license = "MIT"
repository = "https://github.com/aaronkwhite/linear-cli"
homepage = "https://github.com/aaronkwhite/linear-cli"
authors = ["Aaron K White"]
readme = "README.md"
keywords = ["cli", "linear", "graphql", "issue-tracking", "project-management"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/superpowers/", ".github/"]

[[bin]]
name = "lin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cynic = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
comfy-table = "7"
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "6"
termimad = "0.30"
toml = "0.8"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cynic-codegen = "3"

[dev-dependencies]
assert_cmd = "2"
cynic-parser = "0.11"
predicates = "3"
wiremock = "0.6"
temp-env = "0.3"
serial_test = "3"
