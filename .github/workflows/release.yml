name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: lin
            archive: lin-x86_64-linux.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: lin
            archive: lin-aarch64-linux.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: lin
            archive: lin-x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: lin
            archive: lin-aarch64-macos.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross
      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}
          cd ../../..
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lin-x86_64-linux.tar.gz
            lin-aarch64-linux.tar.gz
            lin-x86_64-macos.tar.gz
            lin-aarch64-macos.tar.gz

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_MACOS_ARM=$(shasum -a 256 lin-aarch64-macos.tar.gz | cut -d' ' -f1)
          SHA_MACOS_X86=$(shasum -a 256 lin-x86_64-macos.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM=$(shasum -a 256 lin-aarch64-linux.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X86=$(shasum -a 256 lin-x86_64-linux.tar.gz | cut -d' ' -f1)
          cat > lin.rb <<FORMULA
          class Lin < Formula
            desc "A fast, native CLI for Linear — manage issues, projects, cycles, and more"
            homepage "https://github.com/aaronkwhite/linear-cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/aaronkwhite/linear-cli/releases/download/v#{version}/lin-aarch64-macos.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              else
                url "https://github.com/aaronkwhite/linear-cli/releases/download/v#{version}/lin-x86_64-macos.tar.gz"
                sha256 "${SHA_MACOS_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/aaronkwhite/linear-cli/releases/download/v#{version}/lin-aarch64-linux.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/aaronkwhite/linear-cli/releases/download/v#{version}/lin-x86_64-linux.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "lin"
            end

            test do
              assert_match "lin", shell_output("#{bin}/lin --version")
            end
          end
          FORMULA
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' lin.rb
      - name: Push to homebrew-tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/aaronkwhite/homebrew-tap.git
          cp lin.rb homebrew-tap/Formula/lin.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lin.rb
          git commit -m "Update lin to ${GITHUB_REF_NAME#v}"
          git push
