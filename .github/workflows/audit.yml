name: Security Audit

on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml]
  # No paths filter here on purpose. This job is a required status check on
  # main, and a required check that is skipped never reports — it leaves the
  # PR permanently blocked. It must run on every pull request.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

# cargo-audit is a standalone tool, not part of this crate's build, so it is
# built with the latest stable toolchain rather than the pinned channel in
# rust-toolchain.toml. RUSTUP_TOOLCHAIN overrides that file for this job.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
